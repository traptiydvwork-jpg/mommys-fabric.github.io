<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mommy's Fabric - Creative Gift Designs</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        header {
            background-color: #ff69b4;
            color: white;
            text-align: center;
            padding: 50px 20px;
        }
        header h1 {
            margin: 0;
            font-size: 2.5em;
        }
        header p {
            font-size: 1.2em;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
        }
        .gallery img {
            width: 300px;
            height: 200px;
            object-fit: cover;
            margin: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .video-section {
            text-align: center;
            margin: 40px 0;
        }
        iframe {
            width: 100%;
            max-width: 560px;
            height: 315px;
            border: none;
        }
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px;
        }
        footer a {
            color: #ff69b4;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Mommy's Fabric</h1>
        <p>Discover creative designs for unique gifts! Subscribe to our YouTube channel for tutorials and inspiration.</p>
        <a href="https://www.youtube.com/@mommys_fabric" target="_blank" style="background-color: white; color: #ff69b4; padding: 10px 20px; text-decoration: none; border-radius: 5px;">Subscribe Now</a>
    </header>
    
    <div class="container">
        <h2>Featured Designs</h2>
        <div class="gallery">
            <img src="https://via.placeholder.com/300x200?text=Gift+Design+1" alt="Creative Gift Design 1">
            <img src="https://via.placeholder.com/300x200?text=Gift+Design+2" alt="Creative Gift Design 2">
            <img src="https://via.placeholder.com/300x200?text=Gift+Design+3" alt="Creative Gift Design 3">
            <!-- Add more images as needed -->
        </div>
        
        <div class="video-section">
            <h2>Latest Video</h2>
            <iframe src="https://www.youtube.com/embed/YOUR_VIDEO_ID_HERE" allowfullscreen></iframe>
            <!-- Replace YOUR_VIDEO_ID_HERE with an actual video ID from the channel -->
        </div>
    </div>
    
    <footer>
        <p>Follow us: <a href="https://www.youtube.com/@mommys_fabric">YouTube</a> | <a href="mailto:contact@mommysfabric.com">Email</a></p>
        <p>&copy; 2023 Mommy's Fabric. All rights reserved.</p>
    </footer>
</body>
</html>
